name: Homepage release catalogue validation

on:
  pull_request:
    branches: [main]
    paths:
      - data/homepage.json
      - scripts/releases.py
      - .github/workflows/validate-homepage-release.yml
  push:
    branches: [main]
    paths:
      - data/homepage.json
      - scripts/releases.py
      - .github/workflows/validate-homepage-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate complete catalogue and promotion history
        run: python3 scripts/releases.py validate
      - name: Check immutable Q2/Q3 catalogue, promotion chain and current pointer
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data/homepage.json").read_text())
          e=next(e for e in p["entities"] if e["id"]=="pipeline-news")
          releases={r["id"]:r for r in e["releases"]}
          q2="202609082224"
          q3="202611132345"
          v920="202611140306"
          assert {q2,q3,v920} <= releases.keys(), "missing retained release"
          for rid in (q2,q3,v920):
              assert releases[rid]["url"]==f"https://globalgrid2050.com/uk_renewables_pipeline/{rid}/", f"incorrect URL: {rid}"
              assert releases[rid]["status"]=="available", f"unavailable release: {rid}"
          assert releases[v920]["source_ref"]=="https://github.com/Ventusltd/globalgrid2050/tree/a5988652003fb29e054ffa7860d8e53fe6458edc/uk_renewables_pipeline/202611140306", "unverified moving source ref"
          news=[x for x in p["promotions"] if x["entity_id"]=="pipeline-news"]
          assert news, "missing Pipeline News history"
          q3_moves=[x for x in news if x["from_release_id"]==q2 and x["to_release_id"]==q3]
          assert len(q3_moves)==1, "missing or duplicate original Q3 promotion"
          assert news.index(q3_moves[0])==0, "original Q3 promotion order changed"
          assert len(news)>=2, "missing successor promotion"
          successor=[x for x in news if x["from_release_id"]==q3 and x["to_release_id"]==v920]
          assert len(successor)==1, "V9.20 must follow Q3 exactly once"
          assert news.index(successor[0])==1, "successor not directly after Q3"
          assert news[-1]["to_release_id"]==e["operative_release_id"], "pointer differs from latest audited promotion"
          v921="202611141017"
          v922="202611151300"
          assert {v921,v922} <= releases.keys(), "missing V9.21/V9.22 versions"
          assert releases[v921]["status"]=="available" and releases[v922]["status"]=="available", "release archive unavailable"
          assert releases[v922]["url"]==f"https://globalgrid2050.com/uk_renewables_pipeline/{v922}/", "incorrect V9.22 URL"
          assert releases[v922]["source_ref"]=="https://github.com/Ventusltd/globalgrid2050/tree/0719ddc28f2a418281594549d4667c9916ff6b20/uk_renewables_pipeline/202611151300", "wrong immutable release source SHA"
          assert any(x["from_release_id"]==v921 and x["to_release_id"]==v922 for x in news), "V9.22 promotion audit missing"
          v923="202611160020"
          assert v923 in releases and releases[v923]["status"]=="available", "V9.23 release missing"
          assert releases[v923]["url"]==f"https://globalgrid2050.com/uk_renewables_pipeline/{v923}/", "incorrect V9.23 URL"
          assert releases[v923]["source_ref"]=="https://github.com/Ventusltd/globalgrid2050/tree/1559f40e73a4e454c39b23d5172cf4c5e96ef3ea/uk_renewables_pipeline/202611160020", "incorrect immutable V9.23 source"
          assert any(x["from_release_id"]==v922 and x["to_release_id"]==v923 for x in news), "V9.23 promotion audit missing"
          v924="202611161244"
          assert v924 in releases and releases[v924]["status"]=="available", "V9.24 missing"
          assert releases[v924]["url"]==f"https://globalgrid2050.com/uk_renewables_pipeline/{v924}/", "V9.24 URL"
          assert releases[v924]["source_ref"]=="https://github.com/Ventusltd/globalgrid2050/tree/6d019006d2d091e45f7b30eeafd756126230e9d7/uk_renewables_pipeline/202611161244", "V9.24 must pin immutable source commit"
          assert any(x["from_release_id"]==v923 and x["to_release_id"]==v924 for x in news), "V9.24 promotion history missing"
          v928="202611161757"
          assert v928 in releases and releases[v928]["status"]=="available", "V9.28 missing"
          assert releases[v928]["url"]==f"https://globalgrid2050.com/uk_renewables_pipeline/{v928}/", "V9.28 URL"
          assert releases[v928]["source_ref"]=="https://github.com/Ventusltd/globalgrid2050/tree/84c739ad711b3ce8476acdfab219c8f8b67f102d/uk_renewables_pipeline/202611161757", "V9.28 must pin exact accepted product source"
          assert any(x["from_release_id"]==v924 and x["to_release_id"]==v928 for x in news), "V9.24 to V9.28 promotion history missing"
          v929="202611162354"
          assert v929 in releases and releases[v929]["status"]=="available", "V9.29 missing"
          assert releases[v929]["url"]==f"https://globalgrid2050.com/uk_renewables_pipeline/{v929}/", "V9.29 URL"
          assert releases[v929]["source_ref"]=="https://github.com/Ventusltd/globalgrid2050/tree/bc8ba03b74dc88cd1fa9d181eb40eb45045b1291/uk_renewables_pipeline/202611162354", "V9.29 must pin exact accepted product source"
          assert any(x["from_release_id"]==v928 and x["to_release_id"]==v929 for x in news), "V9.28 to V9.29 promotion history missing"
          v930="202611170147"
          assert v930 in releases and releases[v930]["status"]=="available", "V9.30 missing"
          assert releases[v930]["url"]==f"https://globalgrid2050.com/uk_renewables_pipeline/{v930}/", "V9.30 URL"
          assert releases[v930]["source_ref"]=="https://github.com/Ventusltd/globalgrid2050/tree/ed7b972435dc11c2aa99c69226719c31d822ed21/uk_renewables_pipeline/202611170147", "V9.30 must pin exact accepted product source"
          assert any(x["from_release_id"]==v929 and x["to_release_id"]==v930 for x in news), "V9.29 to V9.30 promotion history missing"
          assert e["operative_release_id"]==v930, "unexpected operative target"
          assert len({x["to_release_id"] for x in news})==len(news), "repeated promotion target"
          print("PASS: historical Q2/Q3/V9.20/V9.21/V9.22/V9.23/V9.24/V9.28/V9.29 retained and exact-source V9.30 operative")
          PY
