name: Build and commit homepage fallback on isolated release branch

on:
  push:
    branches:
      - release/pipeline-news-202611132345-20261114
      - release/tacit15-vedic-v2-20261126
    paths:
      - data/homepage.json
      - tests/test_vedic_entry.py
      - .github/workflows/build-homepage-release-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-q3-fallback-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.event_name == 'push' && github.ref_name || 'release/pipeline-news-202611132345-20261114' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and regenerate fallback from the pinned owner catalogue
        run: |
          set -euo pipefail
          python3 scripts/releases.py validate
          python3 scripts/build_homepage_fallback.py
          python3 -m unittest discover -s tests
          node --check assets/versioned-homepage.js
          python3 scripts/fetch_active_pages.py --check
      - name: Commit only generated fallback HTML to release branch
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            release/pipeline-news-202611132345-20261114|release/tacit15-vedic-v2-20261126) ;;
            *) echo 'Refusing unreserved branch'; exit 1 ;;
          esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          if git diff --cached --quiet; then
            echo 'Fallback already matches the catalogue'
            exit 0
          fi
          git diff --cached --name-only | grep -Fx index.html
          git commit -m 'build(homepage): regenerate operative release fallback'
          git push origin HEAD:"$TARGET_BRANCH"
          echo 'Generated fallback committed to isolated release branch'
