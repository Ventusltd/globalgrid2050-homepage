name: Deploy static homepage to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version catalogue
        run: |
          python3 scripts/releases.py validate
          python3 scripts/build_homepage_fallback.py
          git diff --exit-code -- index.html
          python3 -m unittest discover -s tests
          node --check assets/versioned-homepage.js
          python3 scripts/fetch_active_pages.py --check
      - name: Check desktop and mobile browser behaviour
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/homepage-browser" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/homepage-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/homepage-browser/node_modules/playwright" node tests/homepage-browser.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-browser-evidence
          path: browser-evidence
          if-no-files-found: warn
      - name: Assemble bounded homepage bundle
        # Browser checks run before this bundle can be published.
        # No local workstation security settings are involved.
        run: |
          mkdir -p _site/assets _site/data
          cp index.html .nojekyll _site/
          cp assets/versioned-homepage.js assets/versioned-homepage.css _site/assets/
          cp data/homepage.json data/active-pages.json data/presentation.json data/entity-types.json _site/data/
          python3 -c "from pathlib import Path; n=sum(p.stat().st_size for p in Path('_site').rglob('*') if p.is_file()); print('Homepage bytes:', n); assert n < 1000000, 'Homepage bundle exceeds 1 MB budget'"
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
