name: Deploy static homepage to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version catalogue
        run: |
          python3 scripts/releases.py validate
          python3 -m unittest discover -s tests
          node --check assets/versioned-homepage.js
      - name: Assemble bounded homepage bundle
        run: |
          mkdir -p _site/assets _site/data
          cp index.html .nojekyll _site/
          cp assets/versioned-homepage.js assets/versioned-homepage.css _site/assets/
          cp data/homepage.json _site/data/
          python3 -c "from pathlib import Path; n=sum(p.stat().st_size for p in Path('_site').rglob('*') if p.is_file()); print('Homepage bytes:', n); assert n < 1000000, 'Homepage bundle exceeds 1 MB budget'"
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
